<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shelf</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dock">
    <div id="bar" class="bar">
      <button id="stripe" class="tile chart" hidden></button>
      <button id="claude" class="tile claude" hidden></button>
      <div class="apps">
        <button id="start" class="start" aria-label="Start menu" title="Start">
          <span class="winlogo"><i></i><i></i><i></i><i></i></span>
        </button>
        <div id="running" class="app-row"></div>
        <div id="pinned" class="app-row"></div>
      </div>
      <button id="github" class="tile github" hidden></button>
      <div id="extras" class="extras"></div>
      <button id="battery" class="tile square battery" hidden></button>
      <button id="more" class="tile more" aria-label="More widgets" title="More"></button>
      <button id="clock" class="tile square clock"></button>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <script src="shared.js"></script>
    <script src="dock.js"></script>
  </body>
</html>
