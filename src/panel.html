<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shelf panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="panel">
    <header class="panel-head">
      <button id="back" class="icon-btn" aria-label="Back" title="Back" hidden></button>
      <h1 id="title"></h1>
      <button id="refresh" class="icon-btn" aria-label="Refresh" title="Refresh" hidden></button>
      <button id="close" class="icon-btn" aria-label="Close" title="Close"></button>
    </header>
    <main id="content" class="panel-body"></main>
    <script src="shared.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
